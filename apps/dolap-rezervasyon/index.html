<!doctype html>
<html lang="tr" class="privacy-locked">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<title>Dolap Rezervasyon Sistemi</title>
<link rel="stylesheet" href="/assets/css/privacy-gate.css">
<script src="/assets/js/privacy-gate.js" defer></script>
<style>
:root{--bg:#f6f8fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#e5e7eb;--navy:#0f172a;--blue:#2563eb;--green:#059669;--red:#dc2626;--amber:#d97706}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.wrap{max-width:1500px;margin:auto;padding:24px}.top{background:linear-gradient(135deg,#0b1327,#172554);color:#fff;padding:26px;border-radius:24px;display:flex;justify-content:space-between;gap:20px;align-items:center;box-shadow:0 18px 50px rgba(15,23,42,.18)}.top h1{margin:0;font-size:27px}.top p{margin:6px 0 0;color:#cbd5e1}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:700;cursor:pointer}.btn.primary{background:#fff;color:#0f172a}.btn.blue{background:var(--blue);color:#fff}.btn.red{background:var(--red);color:#fff}.btn.ghost{background:#eef2ff;color:#1e3a8a}.toolbar,.stats,.panel{margin-top:18px}.toolbar{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}.toolbar input{flex:1;min-width:220px;border:1px solid var(--line);border-radius:12px;padding:12px}.floor-tabs{display:flex;gap:8px;flex-wrap:wrap}.floor-tabs button{border:1px solid var(--line);background:#fff;padding:10px 13px;border-radius:11px;font-weight:700;cursor:pointer}.floor-tabs button.active{background:#0f172a;color:#fff;border-color:#0f172a}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.stat small{color:var(--muted);font-weight:700}.stat b{display:block;font-size:28px;margin-top:5px}.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.panel-head h2{margin:0;font-size:20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}.locker{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff;cursor:pointer;min-height:102px;text-align:left}.locker:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(15,23,42,.08)}.locker .no{font-weight:900;font-size:17px}.locker .state{margin-top:8px;font-size:12px;font-weight:800}.locker .who{font-size:12px;color:var(--muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.locker.empty .state{color:var(--green)}.locker.occupied{border-color:#bfdbfe;background:#eff6ff}.locker.occupied .state{color:var(--blue)}.locker.faulty{border-color:#fecaca;background:#fff1f2}.locker.faulty .state{color:var(--red)}.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.58);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal-bg.open{display:flex}.modal{width:min(560px,100%);background:#fff;border-radius:22px;padding:22px;box-shadow:0 24px 80px rgba(0,0,0,.3)}.modal h3{margin:0 0 16px}.form{display:grid;gap:12px}.form label{font-size:12px;font-weight:800;color:#475569}.form input,.form select{width:100%;margin-top:5px;border:1px solid var(--line);border-radius:11px;padding:11px}.modal-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:16px}.privacy-note2{margin-top:12px;color:#64748b;font-size:12px}.back{color:#cbd5e1;text-decoration:none;font-weight:700;font-size:13px}@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}}@media(max-width:520px){.wrap{padding:12px}.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
<div><a class="back" href="/">← Ana siteye dön</a><h1>Dolap Rezervasyon Sistemi</h1><p>NP Sağlık Yerleşkesi · Öğrenci dolap yönetimi</p></div>
<div class="actions"><button class="btn primary" onclick="exportCSV()">CSV İndir</button><button class="btn primary" onclick="document.getElementById('csvFile').click()">CSV Yükle</button><input id="csvFile" type="file" accept=".csv" hidden><button class="btn red" onclick="resetAll()">Tümünü Sıfırla</button></div>
</header>
<section class="toolbar"><input id="search" placeholder="Dolap no, ad soyad veya öğrenci no ara..."><div id="floors" class="floor-tabs"></div></section>
<section class="stats"><div class="stat"><small>Toplam Dolap</small><b id="sTotal">0</b></div><div class="stat"><small>Dolu</small><b id="sOccupied">0</b></div><div class="stat"><small>Boş</small><b id="sEmpty">0</b></div><div class="stat"><small>Arızalı</small><b id="sFaulty">0</b></div></section>
<section class="panel"><div class="panel-head"><div><h2 id="floorTitle">Tüm Dolaplar</h2><div class="privacy-note2">Kişisel veriler GitHub kaynak kodunda tutulmaz. Girdiğiniz kayıtlar yalnızca bu tarayıcının localStorage alanında saklanır.</div></div><button class="btn blue" onclick="openNew()">+ Yeni Atama</button></div><div id="lockerGrid" class="grid"></div></section>
</div>
<div id="modalBg" class="modal-bg"><div class="modal"><h3 id="modalTitle">Dolap Kaydı</h3><div class="form"><label>Dolap No<input id="fLocker"></label><label>Kat<select id="fFloor"><option value="-2">-2. Kat</option><option value="1">1. Kat</option><option value="5">5. Kat</option><option value="6">6. Kat</option><option value="7">7. Kat</option><option value="8">8. Kat</option><option value="9">9. Kat</option></select></label><label>Ad Soyad<input id="fName" autocomplete="off"></label><label>Telefon<input id="fPhone" autocomplete="off"></label><label>Öğrenci No<input id="fStudentNo" autocomplete="off"></label><label>Durum<select id="fStatus"><option value="empty">Boş</option><option value="occupied">Dolu</option><option value="faulty">Arızalı</option></select></label><label>Not<input id="fNote" autocomplete="off"></label></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Vazgeç</button><button class="btn red" id="releaseBtn" onclick="releaseLocker()">Dolabı Boşalt</button><button class="btn blue" onclick="saveModal()">Kaydet</button></div></div></div>
<script>
const KEY='np_saglik_dolap_verileri_public_clean_v1';const floors=[['-2','-2. Kat'],['1','1. Kat'],['5','5. Kat'],['6','6. Kat'],['7','7. Kat'],['8','8. Kat'],['9','9. Kat']];let current='all',editing=null;
function make(floor,no){return{id:floor+'-'+no,floor,lockerNumber:String(no),studentName:'',studentPhone:'',studentNo:'',status:'empty',note:''}}
function defaults(){const a=[];for(let i=1;i<=35;i++)a.push(make('-2',i<10?'B0'+i:'B'+i));for(let i=1100;i<=1200;i++)a.push(make('1',i));for(let i=501;i<=550;i++)a.push(make('5',i));for(let i=601;i<=650;i++)a.push(make('6',i));for(let i=701;i<=750;i++)a.push(make('7',i));for(let i=801;i<=850;i++)a.push(make('8',i));for(let i=901;i<=925;i++)a.push(make('9',i));return a}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');return Array.isArray(x)&&x.length?x:defaults()}catch(e){return defaults()}}let data=load();function persist(){localStorage.setItem(KEY,JSON.stringify(data))}
function floorName(id){return(floors.find(x=>x[0]===id)||[id,id])[1]}
function renderTabs(){document.getElementById('floors').innerHTML=[['all','Tümü'],...floors].map(x=>`<button class="${current===x[0]?'active':''}" onclick="current='${x[0]}';render()">${x[1]}</button>`).join('')}
function render(){renderTabs();const q=document.getElementById('search').value.trim().toLocaleLowerCase('tr');let list=data.filter(x=>current==='all'||x.floor===current).filter(x=>!q||[x.lockerNumber,x.studentName,x.studentNo,x.studentPhone].join(' ').toLocaleLowerCase('tr').includes(q));document.getElementById('floorTitle').textContent=current==='all'?'Tüm Dolaplar':floorName(current);document.getElementById('lockerGrid').innerHTML=list.map(x=>`<button class="locker ${x.status}" onclick="openEdit('${x.id.replace(/'/g,"\\'")}')"><div class="no">#${esc(x.lockerNumber)}</div><div class="state">${x.status==='occupied'?'DOLU':x.status==='faulty'?'ARIZALI':'BOŞ'}</div><div class="who">${esc(x.studentName||floorName(x.floor))}</div></button>`).join('');const scope=data.filter(x=>current==='all'||x.floor===current);document.getElementById('sTotal').textContent=scope.length;document.getElementById('sOccupied').textContent=scope.filter(x=>x.status==='occupied').length;document.getElementById('sEmpty').textContent=scope.filter(x=>x.status==='empty').length;document.getElementById('sFaulty').textContent=scope.filter(x=>x.status==='faulty').length}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function openEdit(id){editing=id;const x=data.find(v=>v.id===id);if(!x)return;document.getElementById('modalTitle').textContent='Dolap #'+x.lockerNumber;document.getElementById('fLocker').value=x.lockerNumber;document.getElementById('fFloor').value=x.floor;document.getElementById('fName').value=x.studentName||'';document.getElementById('fPhone').value=x.studentPhone||'';document.getElementById('fStudentNo').value=x.studentNo||'';document.getElementById('fStatus').value=x.status;document.getElementById('fNote').value=x.note||'';document.getElementById('releaseBtn').style.display='inline-block';document.getElementById('modalBg').classList.add('open')}
function openNew(){editing=null;document.getElementById('modalTitle').textContent='Yeni Dolap Ataması';document.getElementById('fLocker').value='';document.getElementById('fFloor').value=current==='all'?'1':current;document.getElementById('fName').value='';document.getElementById('fPhone').value='';document.getElementById('fStudentNo').value='';document.getElementById('fStatus').value='occupied';document.getElementById('fNote').value='';document.getElementById('releaseBtn').style.display='none';document.getElementById('modalBg').classList.add('open')}
function closeModal(){document.getElementById('modalBg').classList.remove('open')}
function saveModal(){const no=document.getElementById('fLocker').value.trim(),floor=document.getElementById('fFloor').value;if(!no)return alert('Dolap numarası gerekli.');const existing=data.find(x=>x.floor===floor&&x.lockerNumber===no);let x=editing?data.find(v=>v.id===editing):existing;if(!x){x=make(floor,no);data.push(x)}x.floor=floor;x.lockerNumber=no;x.studentName=document.getElementById('fName').value.trim();x.studentPhone=document.getElementById('fPhone').value.trim();x.studentNo=document.getElementById('fStudentNo').value.trim();x.status=document.getElementById('fStatus').value;x.note=document.getElementById('fNote').value.trim();x.id=floor+'-'+no;persist();closeModal();render()}
function releaseLocker(){const x=data.find(v=>v.id===editing);if(!x)return;x.studentName='';x.studentPhone='';x.studentNo='';x.note='';x.status='empty';persist();closeModal();render()}
function resetAll(){if(!confirm('Tüm yerel dolap kayıtları silinsin mi?'))return;data=defaults();persist();render()}
function exportCSV(){const h=['Kat','D.No','Öğrenci Adı ve Soyadı','TEL NO','Öğrenci No','Durum','Not'];const rows=data.map(x=>[floorName(x.floor),x.lockerNumber,x.studentName,x.studentPhone,x.studentNo,x.status,x.note].map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(';'));const blob=new Blob(['\ufeff'+h.join(';')+'\r\n'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='NP_Saglik_Dolap_Listesi.csv';a.click();URL.revokeObjectURL(a.href)}
document.getElementById('csvFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const lines=String(r.result).replace(/^\ufeff/,'').split(/\r?\n/).filter(Boolean);if(lines.length<2)return alert('CSV boş.');const parse=l=>{const a=[];let s='',q=false;for(let i=0;i<l.length;i++){const c=l[i];if(c==='"'){if(q&&l[i+1]==='"'){s+='"';i++}else q=!q}else if(c===';'&&!q){a.push(s);s=''}else s+=c}a.push(s);return a};const incoming=[];lines.slice(1).forEach(l=>{const v=parse(l),floor=(v[0]||'').replace('. Kat','').trim();if(v[1])incoming.push({id:floor+'-'+v[1],floor,lockerNumber:v[1],studentName:v[2]||'',studentPhone:v[3]||'',studentNo:v[4]||'',status:['empty','occupied','faulty'].includes(v[5])?v[5]:(v[2]?'occupied':'empty'),note:v[6]||''})});if(incoming.length){data=defaults();const map=new Map(data.map(x=>[x.floor+'_'+x.lockerNumber,x]));incoming.forEach(x=>{const k=x.floor+'_'+x.lockerNumber;if(map.has(k))Object.assign(map.get(k),x);else data.push(x)});persist();render();alert('CSV kayıtları yüklendi.')}};r.readAsText(f,'utf-8');e.target.value=''})
document.getElementById('search').addEventListener('input',render);document.getElementById('modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal()});render();
</script>
</body></html>
