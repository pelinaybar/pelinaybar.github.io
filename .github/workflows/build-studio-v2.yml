name: Build Studio V2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/event-creator-v2/source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/event-creator-v2/source/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run test:studio
      - run: npx next build --webpack
      - uses: actions/upload-artifact@v4
        with:
          name: studio-v2-static
          path: apps/event-creator-v2/source/out
          include-hidden-files: true
          retention-days: 3
